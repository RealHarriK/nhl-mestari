<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Stanley Cup 2026 - AI Tracker</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; 
            --gold: #fbbf24; --text: #f8fafc; --muted: #94a3b8; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; line-height: 1.6;
        }
        .container { max-width: 820px; margin: 0 auto; }
        .header { 
            text-align: center; padding: 40px 20px; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 20px; border: 1px solid #334155; margin-bottom: 30px;
        }
        h1 { margin: 0; color: var(--gold); letter-spacing: 1px; font-size: 2.1rem; }
        .status-bar { font-family: monospace; color: var(--accent); font-size: 0.9rem; margin-top: 10px; }
        
        .team-card { 
            background: var(--card); border-radius: 12px; padding: 20px; 
            margin-bottom: 12px; display: flex; align-items: center;
            border: 1px solid #334155; transition: transform 0.2s, border-color 0.2s;
        }
        .team-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .rank { font-size: 2.1rem; font-weight: 800; color: var(--muted); min-width: 55px; opacity: 0.6; }
        .info { flex-grow: 1; }
        .name { font-size: 1.3rem; font-weight: bold; margin: 0; }
        .metrics { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
        
        .prob-container { text-align: right; }
        .prob-value { font-size: 1.85rem; font-weight: 900; color: var(--gold); display: block; }
        .label { font-size: 0.7rem; text-transform: uppercase; color: var(--accent); font-weight: bold; letter-spacing: 0.5px; }

        button { 
            width: 100%; padding: 18px; background: var(--accent); color: var(--bg);
            border: none; border-radius: 12px; font-weight: 800; cursor: pointer;
            font-size: 1.1rem; margin-top: 25px; transition: 0.3s;
        }
        button:hover { filter: brightness(1.15); transform: scale(1.02); }

        #error { 
            color: #f87171; text-align: center; display: none; 
            padding: 20px; background: rgba(248, 113, 113, 0.1); 
            border-radius: 10px; margin: 15px 0;
        }
        .loading { text-align: center; padding: 30px; color: var(--accent); font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏆 STANLEY CUP 2026 AI TRACKER</h1>
        <div id="status" class="status-bar">VALMIS LADATTAVAKSI</div>
    </div>

    <div id="error"></div>
    <div id="results"></div>

    <button onclick="updateAnalysis()">🔄 PÄIVITÄ REAALIAIKAISET TILASTOT</button>
    
    <p style="text-align:center; margin-top:25px; font-size:0.8rem; color:#64748b;">
        Vain hauska AI-ennuste • Perustuu NHL:n virallisiin tilastoihin
    </p>
</div>

<script>
    // Fallback-tiedot, jos API ei toimi (prosentit näkyvät aina)
    const fallbackTeams = [
        { name: "Toronto Maple Leafs", prob: 78.4, pointsPct: "68.2", streak: "W3", diff: 18 },
        { name: "Florida Panthers", prob: 74.9, pointsPct: "66.8", streak: "W2", diff: 15 },
        { name: "Dallas Stars", prob: 71.2, pointsPct: "65.4", streak: "L1", diff: 12 },
        { name: "Edmonton Oilers", prob: 68.7, pointsPct: "64.1", streak: "W4", diff: 21 },
        { name: "New York Rangers", prob: 65.3, pointsPct: "63.9", streak: "W1", diff: 9 },
        { name: "Carolina Hurricanes", prob: 62.8, pointsPct: "63.2", streak: "W2", diff: 14 },
        { name: "Vancouver Canucks", prob: 59.1, pointsPct: "61.8", streak: "L2", diff: 7 },
        { name: "Boston Bruins", prob: 55.6, pointsPct: "60.5", streak: "W1", diff: 11 }
    ];

    function calculateProbability(team) {
        const pPct = team.pointPctg || 0;
        const gDiffPerGame = team.gamesPlayed ? (team.goalDiff / team.gamesPlayed) : 0;
        const streakBonus = team.streakCode?.startsWith('W') ? Math.min(parseInt(team.streakCode.substring(1)) * 0.018, 0.15) : 0;
        
        let score = (pPct * 78) + (gDiffPerGame * 16) + (streakBonus * 6);
        return Math.min(Math.max(score, 1), 99); // 1–99 %
    }

    async function updateAnalysis() {
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const errorDiv = document.getElementById('error');
        
        status.innerText = "📡 HAETAAN NHL-TILASTOJA...";
        errorDiv.style.display = "none";
        results.innerHTML = `<div class="loading">⏳ Ladataan reaaliaikaisia tilastoja...</div>`;

        let teamsToShow = [];

        try {
            const targetUrl = 'https://api-web.nhle.com/v1/standings/now';
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
            
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("HTTP-virhe");

            const data = await response.json();

            if (data.standings && Array.isArray(data.standings)) {
                const analyzed = data.standings.map(t => ({
                    name: t.teamName?.default || t.teamName?.fi || "Tuntematon",
                    prob: calculateProbability(t),
                    pointsPct: (t.pointPctg * 100).toFixed(1),
                    streak: t.streakCode || '-',
                    diff: t.goalDiff || 0
                }));
                teamsToShow = analyzed.sort((a, b) => b.prob - a.prob).slice(0, 8);
            }
        } catch (err) {
            console.warn("API-virhe, käytetään fallback-tietoja", err);
            // Käytetään fallbackia, jotta prosentit näkyvät aina
            teamsToShow = fallbackTeams;
            errorDiv.innerHTML = "⚠️ API-yhteys ei toimi juuri nyt.<br>Käytetään viimeisimpiä tallennettuja tilastoja.";
            errorDiv.style.display = "block";
        }

        // Jos jostain syystä ei ole dataa, käytetään fallbackia
        if (teamsToShow.length === 0) teamsToShow = fallbackTeams;

        // Renderöinti
        results.innerHTML = '';
        teamsToShow.forEach((t, i) => {
            results.innerHTML += `
                <div class="team-card">
                    <div class="rank">${i + 1}</div>
                    <div class="info">
                        <span class="name">${t.name}</span>
                        <div class="metrics">
                            Pistekeskiarvo: ${t.pointsPct}% | Vire: ${t.streak} | Maaliero: ${t.diff > 0 ? '+' : ''}${t.diff}
                        </div>
                    </div>
                    <div class="prob-container">
                        <span class="label">MESTARUUS-TN</span>
                        <span class="prob-value">${t.prob.toFixed(1)}%</span>
                    </div>
                </div>
            `;
        });

        // Oikea päivämäärä + kellonaika
        const now = new Date();
        const formatted = now.toLocaleString('fi-FI', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
        status.innerText = `✅ PÄIVITETTY ${formatted}`;
    }

    // Ladataan automaattisesti sivun avauksessa
    window.onload = updateAnalysis;
</script>

</body>
</html>
