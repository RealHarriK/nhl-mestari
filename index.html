<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Stanley Cup 2026 - Live Analyysi</title>
    <style>
        :root { 
            --bg: #0f172a; --card: #1e293b; --accent: #10b981; 
            --gold: #fbbf24; --text: #f8fafc; --muted: #94a3b8; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { 
            text-align: center; padding: 40px 20px; 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 20px; border: 1px solid #334155; margin-bottom: 30px;
        }
        h1 { margin: 0; color: var(--gold); letter-spacing: 1px; font-size: 2rem; }
        .status-bar { font-family: monospace; color: var(--accent); font-size: 0.9rem; margin-top: 10px; }
        
        .team-card { 
            background: var(--card); border-radius: 12px; padding: 20px; 
            margin-bottom: 12px; display: flex; align-items: center;
            border: 1px solid #334155; transition: transform 0.2s, border-color 0.2s;
        }
        .team-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .rank { font-size: 2rem; font-weight: 800; color: var(--muted); min-width: 50px; opacity: 0.5; }
        .info { flex-grow: 1; }
        .name { font-size: 1.25rem; font-weight: bold; margin: 0; display: block; }
        .metrics { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
        
        .prob-container { text-align: right; }
        .prob-value { font-size: 1.8rem; font-weight: 900; color: var(--gold); display: block; }
        .label { font-size: 0.7rem; text-transform: uppercase; color: var(--accent); font-weight: bold; }

        button { 
            width: 100%; padding: 18px; background: var(--accent); color: var(--bg);
            border: none; border-radius: 12px; font-weight: 800; cursor: pointer;
            font-size: 1rem; margin-top: 20px; transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: scale(1.01); }
        
        #error { color: #f87171; text-align: center; display: none; padding: 20px; background: rgba(248, 113, 113, 0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🏆 STANLEY CUP 2026 ANALYYSI</h1>
        <div id="status" class="status-bar">ODOTETAAN SYNKRONOINTIA ESPN:N KANSSA...</div>
    </div>

    <div id="error">Haku epäonnistui. Tarkista nettiyhteys.</div>
    <div id="results"></div>

    <button onclick="updateAnalysis()">PÄIVITÄ REAALIAIKAISET TILASTOT</button>
</div>

<script>
    async function updateAnalysis() {
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const errorDiv = document.getElementById('error');
        
        status.innerText = "NOUDETAAN DATAA ESPN:N PALVELIMELTA...";
        errorDiv.style.display = "none";

        try {
            // ESPN:n täysin julkinen ja vapaa rajapinta (Ei vaadi CORS-kikkailua)
            const response = await fetch('https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings');
            if (!response.ok) throw new Error("API ei vastaa");
            
            const data = await response.json();
            
            // ESPN piilottaa joukkueet konferenssien alle, joten kaivetaan ne esiin tällä funktiolla
            let allTeams = [];
            function extractTeams(node) {
                if (node.standings && node.standings.entries) {
                    allTeams.push(...node.standings.entries);
                }
                if (node.children) {
                    node.children.forEach(child => extractTeams(child));
                }
            }
            extractTeams(data);

            // Analysoidaan ja lasketaan jokainen NHL-joukkue
            const analyzedTeams = allTeams.map(t => {
                const name = t.team.displayName;
                
                // Apufunktio, joka hakee tietyn tilaston ESPN:n listasta (esim. PTS, GP, DIFF)
                const getStat = (abbr) => {
                    const stat = t.stats.find(s => s.abbreviation === abbr);
                    return stat ? parseFloat(stat.value) : 0;
                };

                const points = getStat('PTS');
                const gamesPlayed = getStat('GP');
                const diff = getStat('DIFF');
                
                // Maksimipisteet ovat pelatut pelit * 2
                const pointPct = gamesPlayed > 0 ? (points / (gamesPlayed * 2)) : 0;
                
                // Mestaruusalgoritmi (Painottaa kovaa voittoprosenttia ja positiivista maalieroa)
                // Skaalattu niin, että parhaat saavat n. 15-25% todennäköisyyden.
                const probScore = (pointPct * 50) + (diff * 0.1) - 18;
                const finalProb = Math.max(1.0, probScore); // Aina vähintään 1% mahdollisuus (teoria)

                return {
                    name: name,
                    prob: finalProb,
                    pct: (pointPct * 100).toFixed(1),
                    diff: diff
                };
            });

            // Järjestetään parhaasta huonoimpaan ja näytetään Top 8
            const top8 = analyzedTeams.sort((a, b) => b.prob - a.prob).slice(0, 8);

            results.innerHTML = '';
            top8.forEach((t, i) => {
                results.innerHTML += `
                    <div class="team-card">
                        <div class="rank">${i + 1}</div>
                        <div class="info">
                            <span class="name">${t.name}</span>
                            <div class="metrics">
                                Pistekeskiarvo: ${t.pct}% | Maaliero: ${t.diff > 0 ? '+' : ''}${t.diff}
                            </div>
                        </div>
                        <div class="prob-container">
                            <span class="label">Mestaruus-Tn</span>
                            <span class="prob-value">${t.prob.toFixed(1)}%</span>
                        </div>
                    </div>
                `;
            });

            status.innerText = "LIVE-DATA PÄIVITETTY ESPN:STÄ: " + new Date().toLocaleTimeString('fi-FI');

        } catch (err) {
            console.error("Kriittinen virhe:", err);
            status.innerText = "YHTEYSVIRHE";
            errorDiv.style.display = "block";
        }
    }

    // Lataa data automaattisesti heti, kun sivu avataan
    window.onload = updateAnalysis;
</script>

</body>
</html>
