<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Stanley Cup 2026 - Live Fix</title>
    <style>
        :root { --dark: #0f172a; --accent: #38bdf8; --gold: #fbbf24; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--dark); color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: var(--gold); margin-bottom: 8px; }
        .status { text-align: center; font-size: 0.85rem; color: var(--accent); margin-bottom: 20px; font-family: monospace; }
        
        .team-row { 
            display: flex; align-items: center; padding: 16px; 
            border-bottom: 1px solid #334155; transition: 0.2s;
        }
        .team-row:hover { background: #334155; border-radius: 8px; }
        .rank { width: 40px; font-weight: bold; color: #94a3b8; }
        .name { flex-grow: 1; font-size: 1.1rem; font-weight: 600; }
        .prob { font-size: 1.4rem; font-weight: 800; color: var(--gold); min-width: 80px; text-align: right; }
        
        button { 
            width: 100%; padding: 16px; margin-top: 20px; border: none; border-radius: 12px;
            background: var(--accent); color: var(--dark); font-weight: bold; cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .error-msg { color: #f87171; text-align: center; padding: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🏒 Stanley Cup Ennuste</h1>
        <div id="status" class="status">YHDISTETÄÄN NHL-TIETOKANTAAN...</div>
        
        <div id="errorArea" class="error-msg">
            Yhteysvirhe. NHL:n rajapinta on tilapäisesti saavuttamaton tai selain estää haun.
        </div>

        <div id="results"></div>

        <button onclick="loadData()">PÄIVITÄ TILANNE NYT</button>
    </div>
</div>

<script>
    async function loadData() {
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const errorArea = document.getElementById('errorArea');
        
        status.innerText = "HAETAAN REAALIAIKAISTA DATAA...";
        errorArea.style.display = "none";

        try {
            // Käytetään virallista NHL API:a
            // Huom: Jos tämä antaa CORS-virheen paikallisesti, kokeile avata sivu esim. VS Coden 'Live Serverillä'
            const response = await fetch('https://api-web.nhle.com/v1/standings/now');
            
            if (!response.ok) throw new Error('Verkkovirhe');
            
            const data = await response.json();
            
            // Analysoidaan joukkueet
            const analyzed = data.standings.map(team => {
                // Algoritmi: (Pisteprosentti * 70) + (Maaliero/5) + (Voittoputki * 2)
                const streakBonus = team.streakCode?.startsWith('W') ? parseInt(team.streakCode.substring(1)) * 1.5 : 0;
                const probability = (team.pointPctg * 70) + (team.goalDiff / 8) + streakBonus;

                return {
                    name: team.teamName.default,
                    prob: Math.max(1, probability), // Vähintään 1% mahdollisuus
                    stats: `Pisteet: ${(team.pointPctg * 100).toFixed(1)}% | Vire: ${team.streakCode || 'N/A'}`
                };
            });

            // Lajittelu ja Top 7
            const top7 = analyzed.sort((a, b) => b.prob - a.prob).slice(0, 7);
            
            // Tulostus
            results.innerHTML = '';
            top7.forEach((t, i) => {
                results.innerHTML += `
                    <div class="team-row">
                        <div class="rank">#${i+1}</div>
                        <div class="name">
                            ${t.name}<br>
                            <span style="font-size: 0.7rem; color: #94a3b8;">${t.stats}</span>
                        </div>
                        <div class="prob">${t.prob.toFixed(1)}%</div>
                    </div>
                `;
            });

            status.innerText = "PÄIVITETTY: " + new Date().toLocaleTimeString();

        } catch (error) {
            console.error(error);
            status.innerText = "YHTEYSVIRHE";
            errorArea.style.display = "block";
            
            // Vara-data jos haku epäonnistuu kokonaan (esim. ilman internetyhteyttä)
            results.innerHTML = "<p style='text-align:center; color:#94a3b8;'>Rajapinta vaatii palvelimen toimiakseen. Testaa päivittämällä sivu uudelleen.</p>";
        }
    }

    // Lataa tiedot kun sivu avataan
    loadData();
</script>

</body>
</html>
